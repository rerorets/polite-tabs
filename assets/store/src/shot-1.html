<!doctype html><meta charset="utf-8" /><link rel="stylesheet" href="common.css" />
<body
  class="light"
  style="--grey: #5f6368; --blue: #1a73e8; --green: #188038; --yellow: #f9ab00; --orange: #fa903e"
>
  <div>
    <div class="strip">
      <span class="chip" style="background: var(--grey)">📧 mail (2)</span>
      <span class="chip" style="background: var(--blue)">dev</span>
      <span class="tab" style="--g: var(--blue)"><i></i>[PR] ログイン修正</span>
      <span class="tab" style="--g: var(--blue)"><i></i>my-team/app</span>
      <span class="tab" style="--g: var(--blue)"><i></i>localhost:5173</span>
      <span class="chip" style="background: var(--green)">📝 docs</span>
      <span class="tab" style="--g: var(--green)"><i></i>週次の議事録</span>
      <span class="chip" style="background: var(--orange)">claude</span>
      <span class="tab" style="--g: var(--orange)"><i></i>調べもの</span>
      <span class="note">ほかの拡張のグループ</span>
    </div>
    <div class="strip-body"></div>
  </div>
  <div class="row">
    <div class="copy">
      <div class="brand"><img src="/icon-48.png" alt="" />Polite Tabs</div>
      <h1>URL やタイトルで、<br />タブを<em>自動でグループに</em></h1>
      <ul>
        <li>ルールに当たるタブを、決めたグループへ入れます</li>
        <li>グループはルールの順に、左から並びます</li>
        <li>ほかの拡張が作ったグループには触りません</li>
      </ul>
    </div>
    <div class="frame"><iframe src="/popup.html" width="600" height="470"></iframe></div>
  </div>
</body>
